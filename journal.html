<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный дневник 5 "А"</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --text-muted: #718096;
            --primary: #4c51bf; --primary-light: #ebf4ff; --border: #e2e8f0;
            --grade-5: #38a169; --grade-4: #3182ce; --grade-3: #d69e2e; --grade-2: #e53e3e;
            --absent: #a0aec0; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg: #1a202c; --card: #2d3748; --text: #f7fafc; --text-muted: #a0aec0;
            --primary: #667eea; --primary-light: #2a4365; --border: #4a5568;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; transition: background 0.3s; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        .sidebar { width: 260px; background: var(--card); box-shadow: var(--shadow); padding: 20px 0; display: flex; flex-direction: column; position: fixed; height: 100%; z-index: 100; overflow-y: auto; }
        .logo-area { padding: 0 25px 25px; border-bottom: 2px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area h2 { color: var(--primary); font-size: 22px; font-weight: 800; }
        .theme-toggle { background: var(--bg); border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 10px; border-radius: 50%; }
        
        .nav-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-weight: 700; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
        .nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); }

        .main-content { margin-left: 260px; flex: 1; padding: 30px; width: calc(100% - 260px); }
        .view-section { display: none; animation: fadeIn 0.4s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 20px 25px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .date-nav { display: flex; align-items: center; gap: 15px; }
        .btn-icon { width: 45px; height: 45px; border-radius: 12px; border: none; background: var(--primary-light); color: var(--primary); cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .date-text { font-size: 20px; font-weight: 800; min-width: 200px; text-align: center; }
        select { padding: 12px 20px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--primary); font-weight: 700; font-size: 16px; outline: none; cursor: pointer; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 28px; }
        .stat-icon.blue { background: #ebf8ff; color: #3182ce; }
        .stat-icon.green { background: #f0fff4; color: #38a169; }
        .stat-icon.red { background: #fff5f5; color: #e53e3e; }
        .stat-icon.purple { background: #faf5ff; color: #805ad5; }
        .stat-info h3 { font-size: 28px; font-weight: 800; }
        .stat-info p { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .table-card { background: var(--card); border-radius: 16px; overflow-x: auto; box-shadow: var(--shadow); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: var(--bg); color: var(--text-muted); font-size: 12px; text-transform: uppercase; padding: 15px 10px; text-align: center; border-bottom: 2px solid var(--border); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
        
        .student-cell { display: flex; align-items: center; gap: 10px; text-align: left; white-space: nowrap; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--primary); color: white; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 12px; }
        .student-name { font-weight: 700; font-size: 14px; }

        .input-grade { width: 45px; height: 45px; text-align: center; font-size: 18px; font-weight: 800; border: 2px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); outline: none; transition: 0.2s; }
        .input-grade:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.15); }
        .input-grade[value="5"] { color: var(--grade-5); border-color: var(--grade-5); background: rgba(56, 161, 105, 0.1); }
        .input-grade[value="4"] { color: var(--grade-4); border-color: var(--grade-4); background: rgba(49, 130, 206, 0.1); }
        .input-grade[value="3"] { color: var(--grade-3); border-color: var(--grade-3); background: rgba(214, 158, 46, 0.1); }
        .input-grade[value="2"] { color: var(--grade-2); border-color: var(--grade-2); background: rgba(229, 62, 62, 0.1); }

        .input-note { width: 100%; padding: 12px; font-size: 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); outline: none; box-sizing: border-box; }

        .btn-n { width: 45px; height: 45px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg); color: var(--text-muted); font-weight: 800; cursor: pointer; }
        .btn-n.active { background: var(--absent); color: white; border-color: var(--absent); }
        .btn-del { width: 35px; height: 35px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 14px; }
        .btn-del:hover { color: var(--grade-2); }

        .add-bar { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; gap: 15px; }
        .input-new { flex: 1; padding: 15px 20px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; background: var(--bg); color: var(--text); outline: none; }
        .btn-add { padding: 0 30px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; font-size: 16px; cursor: pointer; }

        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .day-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
        .day-title { background: var(--primary); color: white; padding: 15px 20px; font-weight: 800; border-radius: 16px 16px 0 0; }
        .day-content { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .day-content input { padding: 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; outline: none; }

        .seating-rows { display: flex; flex-direction: column; gap: 20px; }
        .seating-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .desk { background: var(--card); padding: 15px; border-radius: 16px; box-shadow: var(--shadow); border: 2px dashed var(--border); }
        .desk-title { text-align: center; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-size: 12px; }
        .desk-slot { background: var(--bg); padding: 8px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .desk-slot span { font-weight: 800; color: var(--primary); font-size: 13px; }
        .desk-slot select { width: 100%; padding: 6px; font-size: 13px; border-radius: 6px; border: 1px solid var(--border); }

        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; padding: 15px 25px; border-radius: 12px; font-weight: 700; box-shadow: var(--shadow); opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; z-index: 1000; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* АДАПТИВ ДЛЯ ТЕЛЕФОНОВ */
        @media (max-width: 1024px) { .seating-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .logo-area h2, .sidebar .nav-item span { display: none; }
            .nav-item { justify-content: center; padding: 15px 0; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); padding: 15px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .date-nav { justify-content: space-between; }
            select { width: 100%; }
            .seating-row { grid-template-columns: 1fr; }
            
            /* Таблица превращается в карточки на телефоне */
            th { display: none; }
            td { display: block; border: none; padding: 5px 15px; text-align: left; }
            tr { display: flex; flex-direction: column; border-bottom: 2px solid var(--border); padding: 15px 0; background: var(--card); margin-bottom: 10px; border-radius: 12px; position: relative; }
            .grade-wrapper { margin-top: 10px; justify-content: flex-start; }
            td:last-child { position: absolute; right: 10px; top: 10px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="sidebar">
    <div class="logo-area">
        <h2><i class="fa-solid fa-graduation-cap"></i> 5 "А"</h2>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>
    <div class="nav-item active" onclick="showTab('journal', this)"><i class="fa-solid fa-book"></i> <span>Журнал</span></div>
    <div class="nav-item" onclick="showTab('quarters', this)"><i class="fa-solid fa-list-ol"></i> <span>Четверти</span></div>
    <div class="nav-item" onclick="showTab('notes', this)"><i class="fa-solid fa-comment-dots"></i> <span>Замечания</span></div>
    <div class="nav-item" onclick="showTab('schedule', this)"><i class="fa-solid fa-calendar-days"></i> <span>Расписание</span></div>
    <div class="nav-item" onclick="showTab('seating', this)"><i class="fa-solid fa-chair"></i> <span>Рассадка</span></div>
    <div class="nav-item" style="margin-top: auto; color: var(--grade-2);" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> <span>Выйти</span></div>
</div>

<div class="main-content">
    <div id="view-journal" class="view-section active">
        <div class="top-bar">
            <div class="date-nav">
                <button class="btn-icon" onclick="changeDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="date-text" id="date-display">...</div>
                <button class="btn-icon" onclick="changeDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <select id="subject" onchange="changeSubject()">
                <option value="Математика">Математика</option>
                <option value="Русский язык">Русский язык</option>
                <option value="Белорусский язык">Белорусский язык</option>
                <option value="Физкультура">Физкультура</option>
                <option value="Трудовое обучение">Трудовое обучение</option>
                <option value="ОБЖ">ОБЖ</option>
                <option value="Классный час">Классный час</option>
            </select>
        </div>
        
        <div class="stats-row">
            <div class="stat-box"><div class="stat-icon blue"><i class="fa-solid fa-users"></i></div><div class="stat-info"><h3 id="stat-total">0</h3><p>Всего</p></div></div>
            <div class="stat-box"><div class="stat-icon green"><i class="fa-solid fa-user-check"></i></div><div class="stat-info"><h3 id="stat-present">0</h3><p>На месте</p></div></div>
            <div class="stat-box"><div class="stat-icon red"><i class="fa-solid fa-user-xmark"></i></div><div class="stat-info"><h3 id="stat-absent">0</h3><p>Нет (Н)</p></div></div>
        </div>
        
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th style="text-align:left; padding-left:10px;">Ученик</th>
                        <th>Оценка за день</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div class="add-bar">
            <input type="text" class="input-new" id="new-name" placeholder="Введите Фамилию и Имя...">
            <button class="btn-add" onclick="addStudent()">Добавить</button>
        </div>
    </div>

    <div id="view-quarters" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-list-ol"></i> Итоговые оценки</h2>
            <select id="subject-quarters" onchange="changeSubjectQuarters()">
                <option value="Математика">Математика</option>
                <option value="Русский язык">Русский язык</option>
                <option value="Белорусский язык">Белорусский язык</option>
                <option value="Физкультура">Физкультура</option>
                <option value="Трудовое обучение">Трудовое обучение</option>
                <option value="ОБЖ">ОБЖ</option>
                <option value="Классный час">Классный час</option>
            </select>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th style="text-align:left; padding-left:10px;">Ученик</th>
                        <th>1 чет.</th>
                        <th>2 чет.</th>
                        <th>3 чет.</th>
                        <th>4 чет.</th>
                        <th>Год</th>
                    </tr>
                </thead>
                <tbody id="quarters-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-notes" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-comment-dots"></i> Замечания</h2>
            <select id="subject-notes" onchange="changeSubjectNotes()">
                <option value="Математика">Математика</option>
                <option value="Русский язык">Русский язык</option>
                <option value="Белорусский язык">Белорусский язык</option>
                <option value="Физкультура">Физкультура</option>
                <option value="Трудовое обучение">Трудовое обучение</option>
                <option value="ОБЖ">ОБЖ</option>
                <option value="Классный час">Классный час</option>
            </select>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th style="text-align:left; padding-left:10px;">Ученик</th>
                        <th style="width: 80%;">Текст замечания</th>
                    </tr>
                </thead>
                <tbody id="notes-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-schedule" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-calendar-days"></i> Расписание</h2>
            <button class="btn-add" onclick="saveSchedule()"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
        </div>
        <div class="schedule-grid" id="schedule-list"></div>
    </div>

    <div id="view-seating" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-chair"></i> Рассадка (12 парт)</h2>
            <button class="btn-add" onclick="saveSeating()"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
        </div>
        <div class="seating-rows" id="seating-list"></div>
    </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-check-circle"></i> Сохранено</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1v7Ao25hITuwonTkD9e2CgQiu8BxrepI",
        authDomain: "journal-project-acb3e.firebaseapp.com",
        projectId: "journal-project-acb3e",
        storageBucket: "journal-project-acb3e.firebasestorage.app",
        messagingSenderId: "704481815245",
        appId: "1:704481815245:web:af7f8c3ae4233011775784"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const docRef = doc(db, "journal", "class5a");

    // Убрали проверку onAuthStateChanged, чтобы тебя не выкидывало!
    window.logout = function() { signOut(auth).then(() => { window.location.href = "index.html"; }); }

    let students = ["Борисов Андрей", "Виноградов Артём", "Гуков Димитрий", "Григорьев Александр", "Гроховский Давид", "Прокофьев Денис", "Смороеский Евгений", "Макачёва Ульяна", "Кожеметёнов Ина", "Рахматулин Дамиил", "Остапук Маргарита", "Радьева Эмма"];
    let grades = {}, absent = {}, notes = {}; 
    let currentSubject = "Математика", currentDate = new Date();

    let schedule = {
        'Понедельник': ['Физкультура', 'Математика', 'Трудовое обучение', 'Белорусский язык', '', '', ''],
        'Вторник': ['Трудовое обучение', 'Русский язык', 'Математика', 'Белорусский язык', '', '', ''],
        'Среда': ['Всемирная история', 'Математика', 'Физкультура', 'Русский язык', '', '', ''],
        'Четверг': ['Математика', 'Физкультура', 'Белорусский язык', 'ОБЖ', '', '', ''],
        'Пятница': ['Русский язык', 'Белорусская литература', 'Математика', 'Классный час', '', '', ''],
        'Суббота': ['Классный час'] 
    };
    
    let seating = Array(12).fill().map((_, i) => ({ desk: i + 1, seat1: "", seat2: "" }));

    window.toggleTheme = function() {
        const body = document.body; const icon = document.getElementById('theme-icon');
        if (body.getAttribute('data-theme') === 'dark') { body.removeAttribute('data-theme'); icon.className = 'fa-solid fa-moon'; } 
        else { body.setAttribute('data-theme', 'dark'); icon.className = 'fa-solid fa-sun'; }
    }

    function showToast() { const t = document.getElementById('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function getDateString(date) { return date.toISOString().split('T')[0]; }
    function updateDateDisplay() { const options = { weekday: 'long', day: 'numeric', month: 'long' }; let str = currentDate.toLocaleDateString('ru-RU', options); document.getElementById('date-display').innerText = str.charAt(0).toUpperCase() + str.slice(1); }

    window.changeDate = function(days) { currentDate.setDate(currentDate.getDate() + days); updateDateDisplay(); renderTable(); }

    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.students) students = data.students;
            if (data.grades) grades = data.grades;
            if (data.absent) absent = data.absent;
            if (data.notes) notes = data.notes;
            if (data.schedule) schedule = data.schedule;
            if (data.seating) seating = data.seating;
            renderAll();
        } else { saveToCloud(); }
    });

    async function saveToCloud() {
        try { await setDoc(docRef, { students, grades, absent, notes, schedule, seating }); showToast(); } catch (e) { console.error(e); }
    }

    function renderAll() {
        renderTable();
        renderQuarters();
        renderNotes();
    }

    window.renderTable = function() {
        const tbody = document.getElementById('table-body'); if(!tbody) return; tbody.innerHTML = '';
        const dateStr = getDateString(currentDate); let presentCount = 0, absentCount = 0;
        
        students.forEach((name, index) => {
            const tr = document.createElement('tr'); 
            const dayKey = `${dateStr}_${currentSubject}_${name}`;
            const isAbsent = absent[dayKey];
            if (isAbsent) absentCount++; else presentCount++;
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2);

            const makeInput = (val, key) => {
                const colorClass = val ? `style="color: var(--grade-${val}); border-color: var(--grade-${val});"` : '';
                return `<input type="text" class="input-grade" maxlength="1" value="${val || ''}" ${colorClass} oninput="updateGrade('${key}', this.value)">`;
            };

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><div class="student-cell"><div class="avatar">${initials}</div><div class="student-name">${name}</div></div></td>
                <td>
                    <div class="grade-wrapper" style="display:flex; gap:5px; justify-content:center;">
                        ${makeInput(grades[dayKey], dayKey)}
                        <button class="btn-n ${isAbsent ? 'active' : ''}" onclick="toggleAbsent('${dayKey}')">Н</button>
                    </div>
                </td>
                <td><button class="btn-del" onclick="deleteStudent(${index})"><i class="fa-solid fa-trash"></i></button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('stat-total').innerText = students.length;
        document.getElementById('stat-present').innerText = presentCount;
        document.getElementById('stat-absent').innerText = absentCount;
    }

    window.renderQuarters = function() {
        const tbody = document.getElementById('quarters-body'); if(!tbody) return; tbody.innerHTML = '';
        const subj = document.getElementById('subject-quarters').value;
        
        students.forEach((name, index) => {
            const tr = document.createElement('tr'); 
            const q1Key = `Q1_${subj}_${name}`;
            const q2Key = `Q2_${subj}_${name}`;
            const q3Key = `Q3_${subj}_${name}`;
            const q4Key = `Q4_${subj}_${name}`;
            const yearKey = `YEAR_${subj}_${name}`;
            
            const makeInput = (val, key) => {
                const colorClass = val ? `style="color: var(--grade-${val}); border-color: var(--grade-${val});"` : '';
                return `<input type="text" class="input-grade" maxlength="1" value="${val || ''}" ${colorClass} oninput="updateGrade('${key}', this.value)">`;
            };

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><div class="student-cell"><div class="avatar">${name[0]}</div><div class="student-name">${name}</div></div></td>
                <td>${makeInput(grades[q1Key], q1Key)}</td>
                <td>${makeInput(grades[q2Key], q2Key)}</td>
                <td>${makeInput(grades[q3Key], q3Key)}</td>
                <td>${makeInput(grades[q4Key], q4Key)}</td>
                <td>${makeInput(grades[yearKey], yearKey)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.renderNotes = function() {
        const tbody = document.getElementById('notes-body'); if(!tbody) return; tbody.innerHTML = '';
        const subj = document.getElementById('subject-notes').value;
        const dateStr = getDateString(currentDate);

        students.forEach((name, index) => {
            const tr = document.createElement('tr'); 
            const noteKey = `${dateStr}_${subj}_${name}`;
            
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><div class="student-cell"><div class="avatar">${name[0]}</div><div class="student-name">${name}</div></div></td>
                <td><input type="text" class="input-note" placeholder="Написать замечание..." value="${notes[noteKey] || ''}" oninput="updateNote('${noteKey}', this.value)"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.updateGrade = function(key, value) { grades[key] = value; saveToCloud(); renderAll(); }
    window.updateNote = function(key, value) { notes[key] = value; saveToCloud(); }
    window.toggleAbsent = function(key) { absent[key] = !absent[key]; if (absent[key]) grades[key] = ''; saveToCloud(); renderAll(); }
    
    window.changeSubject = function() { currentSubject = document.getElementById('subject').value; renderTable(); }
    window.changeSubjectQuarters = function() { renderQuarters(); }
    window.changeSubjectNotes = function() { renderNotes(); }

    window.addStudent = function() { 
        const input = document.getElementById('new-name'); 
        if (input.value.trim() !== '') { 
            students.push(input.value.trim()); 
            input.value = ''; 
            saveToCloud(); 
            renderAll(); 
        } 
    }
    
    window.deleteStudent = function(index) { 
        if (confirm('Удалить ученика?')) { 
            students.splice(index, 1); 
            saveToCloud(); 
            renderAll(); 
        } 
    }

    window.showTab = function(tabName, element) {
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active')); element.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active')); document.getElementById(`view-${tabName}`).classList.add('active');
        if (tabName === 'schedule') renderSchedule();
        if (tabName === 'seating') renderSeating();
        if (tabName === 'quarters') renderQuarters();
        if (tabName === 'notes') renderNotes();
    }

    window.renderSchedule = function() {
        const container = document.getElementById('schedule-list'); container.innerHTML = '';
        for (let day in schedule) {
            const div = document.createElement('div'); div.className = 'day-card';
            let html = `<div class="day-title">${day}</div><div class="day-content">`;
            schedule[day].forEach((subj, i) => { html += `<input type="text" id="s_${day}_${i}" value="${subj}" placeholder="Урок ${i+1}">`; });
            html += `</div>`; div.innerHTML = html; container.appendChild(div);
        }
    }

    window.saveSchedule = function() {
        for (let day in schedule) { schedule[day].forEach((_, i) => { schedule[day][i] = document.getElementById(`s_${day}_${i}`).value; }); }
        saveToCloud();
    }

    window.renderSeating = function() {
        const container = document.getElementById('seating-list'); container.innerHTML = '';
        for (let row = 0; row < 3; row++) {
            const rowDiv = document.createElement('div'); rowDiv.className = 'seating-row';
            for (let col = 0; col < 4; col++) {
                const deskIndex = row * 4 + col;
                const desk = seating[deskIndex] || { desk: deskIndex + 1, seat1: "", seat2: "" };
                const deskDiv = document.createElement('div'); deskDiv.className = 'desk';
                let html = `<div class="desk-title">Парта ${desk.desk}</div>`;
                html += `<div class="desk-slot"><span>1:</span><select id="desk_${deskIndex}_1"><option value="">-- Пусто --</option>`;
                students.forEach(s => { html += `<option value="${s}" ${desk.seat1 === s ? 'selected' : ''}>${s}</option>`; });
                html += `</select></div><div class="desk-slot"><span>2:</span><select id="desk_${deskIndex}_2"><option value="">-- Пусто --</option>`;
                students.forEach(s => { html += `<option value="${s}" ${desk.seat2 === s ? 'selected' : ''}>${s}</option>`; });
                html += `</select></div>`;
                deskDiv.innerHTML = html; rowDiv.appendChild(deskDiv);
            }
            container.appendChild(rowDiv);
        }
    }

    window.saveSeating = function() {
        seating.forEach((desk, index) => { desk.seat1 = document.getElementById(`desk_${index}_1`).value; desk.seat2 = document.getElementById(`desk_${index}_2`).value; });
        saveToCloud();
    }

    updateDateDisplay(); renderAll();
</script>
</body>
</html>
