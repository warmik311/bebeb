<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; font-family: 'Nunito', sans-serif; }
        .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #4c51bf; margin-bottom: 20px; font-weight: 800; }
        
        /* Вкладки */
        .tabs { display: flex; margin-bottom: 20px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; cursor: pointer; font-weight: 700; color: #718096; transition: 0.3s; }
        .tab.active { background: #4c51bf; color: white; }

        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: #4c51bf; }
        button { width: 100%; padding: 15px; background: #4c51bf; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        button:hover { background: #434190; transform: translateY(-2px); }
        .btn-link { background: none; color: #4c51bf; font-size: 14px; padding: 5px; margin: 0; text-decoration: underline; }
        .btn-link:hover { background: none; transform: none; }
        #error-msg { color: #e53e3e; margin-top: 10px; font-weight: 600; font-size: 14px; display: none; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }

        /* Красивое модальное окно для сброса пароля */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .modal-content h2 { color: #4c51bf; margin-bottom: 15px; font-size: 20px; }
        .modal-content p { color: #718096; font-size: 14px; margin-bottom: 20px; }
        .modal-content input { margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; font-size: 16px; }
        .btn-cancel { background: #e2e8f0; color: #4a5568; }
        .btn-cancel:hover { background: #cbd5e0; transform: none; }
        #reset-status { color: #38a169; font-weight: 700; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h1>📖 Вход в 5 "А"</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="switchLoginTab('teacher')">Учитель</div>
        <div class="tab" onclick="switchLoginTab('parent')">Родитель</div>
    </div>

    <!-- Форма для Учителя -->
    <div id="form-teacher" class="form-section active">
        <input type="email" id="email-teacher" placeholder="Ваша почта">
        <input type="password" id="password-teacher" placeholder="Пароль">
        <button onclick="loginTeacher()">Войти как учитель</button>
        <button class="btn-link" onclick="openResetModal()">Забыли пароль?</button>
    </div>

    <!-- Форма для Родителя -->
    <div id="form-parent" class="form-section">
        <input type="text" id="login-parent" placeholder="Логин (например, mama)">
        <input type="password" id="password-parent" placeholder="Пароль">
        <button onclick="loginParent()">Войти как родитель</button>
    </div>

    <div id="error-msg"></div>
</div>

<!-- Модальное окно сброса пароля -->
<div class="modal-overlay" id="reset-modal">
    <div class="modal-content">
        <h2>Восстановление пароля</h2>
        <p>Введите почту, на которую зарегистрирован аккаунт учителя.</p>
        <input type="email" id="reset-email" placeholder="Ваша почта">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeResetModal()">Отмена</button>
            <button onclick="sendResetEmail()">Отправить</button>
        </div>
        <div id="reset-status"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1v7Ao25hITuwonTkD9e2CgQiu8BxrepI",
        authDomain: "journal-project-acb3e.firebaseapp.com",
        projectId: "journal-project-acb3e",
        storageBucket: "journal-project-acb3e.firebasestorage.app",
        messagingSenderId: "704481815245",
        appId: "1:704481815245:web:af7f8c3ae4233011775784"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.switchLoginTab = function(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
        document.getElementById('error-msg').style.display = 'none';
        
        if (type === 'teacher') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('form-teacher').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('form-parent').classList.add('active');
        }
    }

    window.loginTeacher = async function() {
        const email = document.getElementById('email-teacher').value;
        const password = document.getElementById('password-teacher').value;
        const errorDiv = document.getElementById('error-msg');

        try {
            await setPersistence(auth, browserLocalPersistence);
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "journal.html"; 
        } catch (error) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Ошибка: неверная почта или пароль!";
        }
    }

    window.loginParent = async function() {
        const login = document.getElementById('login-parent').value.trim();
        const password = document.getElementById('password-parent').value;
        const errorDiv = document.getElementById('error-msg');

        if (!login || !password) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Заполните все поля!";
            return;
        }

        const fakeEmail = login + "@parent.local";

        try {
            await setPersistence(auth, browserLocalPersistence);
            await signInWithEmailAndPassword(auth, fakeEmail, password);
            window.location.href = "journal.html"; 
        } catch (error) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Ошибка: неверный логин или пароль!";
        }
    }

    // Модальное окно
    window.openResetModal = function() {
        document.getElementById('reset-modal').style.display = 'flex';
        document.getElementById('reset-status').style.display = 'none';
        document.getElementById('reset-email').value = '';
    }

    window.closeResetModal = function() {
        document.getElementById('reset-modal').style.display = 'none';
    }

    window.sendResetEmail = async function() {
        const email = document.getElementById('reset-email').value;
        const statusDiv = document.getElementById('reset-status');
        
        if (!email) {
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#e53e3e';
            statusDiv.innerText = "Введите почту!";
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#38a169';
            statusDiv.innerText = "Письмо отправлено! Проверьте почту.";
            setTimeout(() => closeResetModal(), 3000);
        } catch (error) {
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#e53e3e';
            statusDiv.innerText = "Ошибка: проверьте правильность почты.";
        }
    }
</script>
</body>
</html>
