<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный дневник 5 "А"</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #f0f4f8; --card: #ffffff; --text: #2d3748; --text-muted: #718096;
            --primary: #4c51bf; --primary-light: #ebf4ff; --border: #e2e8f0;
            --grade-5: #38a169; --grade-4: #3182ce; --grade-3: #d69e2e; --grade-2: #e53e3e;
            --absent: #a0aec0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg: #1a202c; --card: #2d3748; --text: #f7fafc; --text-muted: #a0aec0;
            --primary: #667eea; --primary-light: #2a4365; --border: #4a5568;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        .sidebar { width: 260px; background: var(--card); box-shadow: var(--shadow); padding: 20px 0; display: flex; flex-direction: column; position: fixed; height: 100%; z-index: 100; overflow-y: auto; }
        .logo-area { padding: 0 25px 25px; border-bottom: 2px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area h2 { color: var(--primary); font-size: 22px; font-weight: 800; white-space: nowrap; }
        .theme-toggle { background: var(--bg); border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 10px; border-radius: 50%; }
        .nav-item { padding: 16px 25px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-weight: 700; cursor: pointer; border-left: 4px solid transparent; }
        .nav-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); }

        .main-content { margin-left: 260px; flex: 1; padding: 30px; width: calc(100% - 260px); }
        .view-section { display: none; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 20px 25px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .date-nav { display: flex; align-items: center; gap: 15px; }
        .btn-icon { width: 45px; height: 45px; border-radius: 12px; border: none; background: var(--primary-light); color: var(--primary); cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .date-text { font-size: 20px; font-weight: 800; min-width: 200px; text-align: center; }
        select { padding: 12px 20px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--primary); font-weight: 700; font-size: 16px; outline: none; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 28px; }
        .stat-icon.blue { background: #ebf8ff; color: #3182ce; }
        .stat-icon.green { background: #f0fff4; color: #38a169; }
        .stat-icon.red { background: #fff5f5; color: #e53e3e; }
        .stat-info h3 { font-size: 28px; font-weight: 800; }
        .stat-info p { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .table-card { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg); color: var(--text-muted); font-size: 13px; text-transform: uppercase; padding: 18px 15px; text-align: center; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
        
        .student-cell { display: flex; align-items: center; gap: 15px; text-align: left; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 14px; }
        .student-name { font-weight: 700; font-size: 16px; }

        .grade-wrapper { display: flex; justify-content: center; gap: 10px; }
        .input-grade { width: 50px; height: 50px; text-align: center; font-size: 22px; font-weight: 800; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
        .input-grade[value="5"] { color: var(--grade-5); border-color: var(--grade-5); }
        .input-grade[value="4"] { color: var(--grade-4); border-color: var(--grade-4); }
        .input-grade[value="3"] { color: var(--grade-3); border-color: var(--grade-3); }
        .input-grade[value="2"] { color: var(--grade-2); border-color: var(--grade-2); }
        
        .btn-n { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); color: var(--text-muted); font-weight: 800; cursor: pointer; }
        .btn-n.active { background: var(--absent); color: white; border-color: var(--absent); }
        .btn-del { width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 16px; }

        .add-bar { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; gap: 15px; }
        .input-new { flex: 1; padding: 15px 20px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; background: var(--bg); color: var(--text); outline: none; }
        .btn-add { padding: 0 30px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; font-size: 16px; cursor: pointer; }

        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .day-card { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
        .day-title { background: var(--primary); color: white; padding: 15px 20px; font-weight: 800; }
        .day-content { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .day-content input { padding: 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }

        .seating-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .desk { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); border: 2px dashed var(--border); }
        .desk-title { text-align: center; font-weight: 800; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; font-size: 13px; }
        .desk-slot { background: var(--bg); padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .desk-slot select { width: 100%; padding: 8px; font-size: 14px; border-radius: 8px; border: 1px solid var(--border); }

        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; padding: 15px 25px; border-radius: 12px; font-weight: 700; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; display: flex; align-items: center; gap: 10px; z-index: 1000; }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .logo-area h2, .sidebar .nav-item span { display: none; }
            .nav-item { justify-content: center; padding: 20px 0; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); padding: 15px; }
            .top-bar { flex-direction: column; align-items: stretch; padding: 15px; gap: 15px; }
            .date-nav { justify-content: space-between; width: 100%; }
            .date-text { font-size: 16px; min-width: auto; }
            select { width: 100%; }
            
            th { display: none; }
            td { display: block; border: none; padding: 5px 15px; text-align: left; }
            tr { display: flex; flex-direction: column; border-bottom: 2px solid var(--border); padding: 15px 0; background: var(--card); margin-bottom: 10px; border-radius: 12px; position: relative; }
            .student-cell { gap: 10px; }
            .grade-wrapper { margin-top: 10px; justify-content: flex-start; }
            td:last-child { position: absolute; right: 10px; top: 10px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="sidebar">
    <div class="logo-area">
        <h2><i class="fa-solid fa-graduation-cap"></i> 5 "А"</h2>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>
    <div class="nav-item active" onclick="showTab('journal', this)">
        <i class="fa-solid fa-book"></i> <span>Журнал</span>
    </div>
    <div class="nav-item" onclick="showTab('schedule', this)">
        <i class="fa-solid fa-calendar-days"></i> <span>Расписание</span>
    </div>
    <div class="nav-item" onclick="showTab('seating', this)">
        <i class="fa-solid fa-chair"></i> <span>Рассадка</span>
    </div>
</div>

<div class="main-content">
    <div id="view-journal" class="view-section active">
        <div class="top-bar">
            <div class="date-nav">
                <button class="btn-icon" onclick="changeDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="date-text" id="date-display">...</div>
                <button class="btn-icon" onclick="changeDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <select id="subject" onchange="changeSubject()">
                <option value="Математика">Математика</option>
                <option value="Русский язык">Русский язык</option>
                <option value="Белорусский язык">Белорусский язык</option>
                <option value="Физкультура">Физкультура</option>
                <option value="Трудовое обучение">Трудовое обучение</option>
                <option value="ОБЖ">ОБЖ</option>
                <option value="Классный час">Классный час</option>
            </select>
        </div>

        <div class="stats-row">
            <div class="stat-box"><div class="stat-icon blue"><i class="fa-solid fa-users"></i></div><div class="stat-info"><h3 id="stat-total">0</h3><p>Всего</p></div></div>
            <div class="stat-box"><div class="stat-icon green"><i class="fa-solid fa-user-check"></i></div><div class="stat-info"><h3 id="stat-present">0</h3><p>На месте</p></div></div>
            <div class="stat-box"><div class="stat-icon red"><i class="fa-solid fa-user-xmark"></i></div><div class="stat-info"><h3 id="stat-absent">0</h3><p>Нет (Н)</p></div></div>
        </div>

        <div class="table-card">
            <table>
                <thead><tr><th>№</th><th style="text-align:left; padding-left:20px;">Ученик</th><th>Оценка</th><th></th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="add-bar">
            <input type="text" class="input-new" id="new-name" placeholder="Введите Фамилию и Имя...">
            <button class="btn-add" onclick="addStudent()">Добавить</button>
        </div>
    </div>

    <div id="view-schedule" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-calendar-days"></i> Расписание</h2>
            <button class="btn-add" onclick="saveSchedule()"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
        </div>
        <div class="schedule-grid" id="schedule-list"></div>
    </div>

    <div id="view-seating" class="view-section">
        <div class="top-bar">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-chair"></i> Рассадка</h2>
            <button class="btn-add" onclick="saveSeating()"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
        </div>
        <div class="seating-grid" id="seating-list"></div>
    </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-check-circle"></i> Сохранено</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1v7Ao25hITuwonTkD9e2CgQiu8BxrepI",
        authDomain: "journal-project-acb3e.firebaseapp.com",
        projectId: "journal-project-acb3e",
        storageBucket: "journal-project-acb3e.firebasestorage.app",
        messagingSenderId: "704481815245",
        appId: "1:704481815245:web:af7f8c3ae4233011775784"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "journal", "class5a");

    let students = ["Борисов Андрей", "Виноградов Артём", "Гуков Димитрий", "Григорьев Александр", "Гроховский Давид", "Прокофьев Денис", "Смороеский Евгений", "Макачёва Ульяна", "Кожеметёнов Ина", "Рахматулин Дамиил", "Остапук Маргарита", "Радьева Эмма"];
    let grades = {};
    let absent = {};
    let currentSubject = "Математика";
    let currentDate = new Date();
    
    let schedule = {
        'Понедельник': ['Физкультура', 'Математика', 'Трудовое обучение', 'Белорусский язык', '', '', ''],
        'Вторник': ['Трудовое обучение', 'Русский язык', 'Математика', 'Белорусский язык', '', '', ''],
        'Среда': ['Всемирная история', 'Математика', 'Физкультура', 'Русский язык', '', '', ''],
        'Четверг': ['Математика', 'Физкультура', 'Белорусский язык', 'ОБЖ', '', '', ''],
        'Пятница': ['Русский язык', 'Белорусская литература', 'Математика', 'Классный час', '', '', ''],
        'Суббота': ['Классный час'] 
    };

    let seating = JSON.parse(localStorage.getItem('seating')) || [
        { desk: 1, seat1: "", seat2: "" },
        { desk: 2, seat1: "", seat2: "" },
        { desk: 3, seat1: "", seat2: "" },
        { desk: 4, seat1: "", seat2: "" },
        { desk: 5, seat1: "", seat2: "" },
        { desk: 6, seat1: "", seat2: "" }
    ];

    window.toggleTheme = function() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            icon.className = 'fa-solid fa-moon';
        } else {
            body.setAttribute('data-theme', 'dark');
            icon.className = 'fa-solid fa-sun';
        }
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function getDateString(date) { return date.toISOString().split('T')[0]; }

    function updateDateDisplay() {
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        let str = currentDate.toLocaleDateString('ru-RU', options);
        document.getElementById('date-display').innerText = str.charAt(0).toUpperCase() + str.slice(1);
    }

    window.changeDate = function(days) {
        currentDate.setDate(currentDate.getDate() + days);
        updateDateDisplay();
        renderTable();
    }

    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.students) students = data.students;
            if (data.grades) grades = data.grades;
            if (data.absent) absent = data.absent;
            if (data.schedule) schedule = data.schedule;
            renderTable();
        } else {
            saveToCloud();
        }
    });

    async function saveToCloud() {
        try {
            await setDoc(docRef, { students, grades, absent, schedule });
            showToast();
        } catch (e) { console.error(e); }
    }

    window.renderTable = function() {
        const tbody = document.getElementById('table-body');
        if(!tbody) return;
        tbody.innerHTML = '';
        const dateStr = getDateString(currentDate);
        let presentCount = 0, absentCount = 0;
        
        students.forEach((name, index) => {
            const tr = document.createElement('tr');
            const key = `${dateStr}_${currentSubject}_${name}`;
            const isAbsent = absent[key];
            if (isAbsent) absentCount++; else presentCount++;
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2);

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><div class="student-cell"><div class="avatar">${initials}</div><div class="student-name">${name}</div></div></td>
            `;
            const tdGrade = document.createElement('td');
            const gradeValue = grades[key] || '';
            tdGrade.innerHTML = `
                <div class="grade-wrapper">
                    <input type="text" class="input-grade" maxlength="1" value="${gradeValue}" oninput="updateGrade('${name}', this.value)">
                    <button class="btn-n ${isAbsent ? 'active' : ''}" onclick="toggleAbsent('${name}')">Н</button>
                </div>
            `;
            tr.appendChild(tdGrade);
            const tdDel = document.createElement('td');
            tdDel.innerHTML = `<button class="btn-del" onclick="deleteStudent(${index})"><i class="fa-solid fa-trash"></i></button>`;
            tr.appendChild(tdDel);
            tbody.appendChild(tr);
        });

        document.getElementById('stat-total').innerText = students.length;
        document.getElementById('stat-present').innerText = presentCount;
        document.getElementById('stat-absent').innerText = absentCount;
    }

    window.updateGrade = function(name, value) {
        const key = `${getDateString(currentDate)}_${currentSubject}_${name}`;
        grades[key] = value;
        if (value) absent[key] = false; 
        saveToCloud(); renderTable();
    }

    window.toggleAbsent = function(name) {
        const key = `${getDateString(currentDate)}_${currentSubject}_${name}`;
        absent[key] = !absent[key];
        if (absent[key]) grades[key] = ''; 
        saveToCloud(); renderTable();
    }

    window.changeSubject = function() {
        currentSubject = document.getElementById('subject').value;
        renderTable();
    }

    window.addStudent = function() {
        const input = document.getElementById('new-name');
        if (input.value.trim() !== '') {
            students.push(input.value.trim());
            input.value = '';
            saveToCloud(); renderTable();
        }
    }

    window.deleteStudent = function(index) {
        if (confirm('Удалить ученика?')) {
            students.splice(index, 1);
            saveToCloud(); renderTable();
        }
    }

    window.showTab = function(tabName, element) {
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        document.querySel
