<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; font-family: 'Nunito', sans-serif; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; margin: 15px; }
        h1 { color: #4c51bf; margin-bottom: 30px; font-weight: 800; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: #4c51bf; }
        button { width: 100%; padding: 15px; background: #4c51bf; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        button:hover { background: #434190; transform: translateY(-2px); }
        .btn-link { background: none; color: #4c51bf; font-size: 14px; padding: 5px; margin: 0; text-decoration: underline; border: none; cursor: pointer; font-weight: 600; }
        .btn-link:hover { background: none; transform: none; color: #434190; }
        
        #error-msg { color: #e53e3e; margin-top: 10px; font-weight: 600; font-size: 14px; display: none; }
        #reset-msg { margin-top: 15px; font-weight: 600; font-size: 14px; display: none; padding: 10px; border-radius: 8px; }
        
        /* Скрываем форму сброса по умолчанию */
        #reset-section { display: none; }
        .reset-title { font-size: 20px; color: #4c51bf; margin-bottom: 15px; font-weight: 800; }
        .reset-text { font-size: 14px; color: #718096; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="login-box">
    <!-- БЛОК 1: ВХОД -->
    <div id="login-section">
        <h1>📖 Вход в 5 "А"</h1>
        <input type="email" id="email" placeholder="Ваша почта">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button class="btn-link" onclick="showReset()">Забыли пароль?</button>
        <div id="error-msg"></div>
    </div>

    <!-- БЛОК 2: СБРОС ПАРОЛЯ (Красивый) -->
    <div id="reset-section">
        <div class="reset-title">🔑 Восстановление</div>
        <div class="reset-text">Введите почту, на которую зарегистрирован аккаунт, и мы отправим ссылку для сброса.</div>
        <input type="email" id="reset-email" placeholder="Ваша почта">
        <button onclick="resetPassword()">Отправить ссылку</button>
        <button class="btn-link" onclick="hideReset()">← Назад ко входу</button>
        <div id="reset-msg"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1v7Ao25hITuwonTkD9e2CgQiu8BxrepI",
        authDomain: "journal-project-acb3e.firebaseapp.com",
        projectId: "journal-project-acb3e",
        storageBucket: "journal-project-acb3e.firebasestorage.app",
        messagingSenderId: "704481815245",
        appId: "1:704481815245:web:af7f8c3ae4233011775784"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // АВТОЛОГИН: Если уже вошел, сразу кидаем в журнал
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "journal.html"; 
        }
    });

    window.login = async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-msg');

        if (!email || !password) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Заполните все поля!";
            return;
        }

        try {
            await setPersistence(auth, browserLocalPersistence);
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "journal.html"; 
        } catch (error) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Ошибка: неверная почта или пароль!";
        }
    }

    // ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
    window.showReset = function() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('reset-section').style.display = 'block';
    }

    window.hideReset = function() {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('reset-section').style.display = 'none';
        document.getElementById('reset-msg').style.display = 'none';
    }

    // ОТПРАВКА ПИСЬМА (Без уродливого окна)
    window.resetPassword = async function() {
        const email = document.getElementById('reset-email').value;
        const msgDiv = document.getElementById('reset-msg');
        
        if (!email) {
            msgDiv.style.display = 'block';
            msgDiv.style.color = '#e53e3e';
            msgDiv.style.background = '#ffebee';
            msgDiv.innerText = "Введите почту!";
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            msgDiv.style.display = 'block';
            msgDiv.style.color = '#38a169';
            msgDiv.style.background = '#e8f5e9';
            msgDiv.innerText = "Письмо отправлено! Проверьте вашу почту.";
        } catch (error) {
            msgDiv.style.display = 'block';
            msgDiv.style.color = '#e53e3e';
            msgDiv.style.background = '#ffebee';
            msgDiv.innerText = "Ошибка: проверьте правильность почты.";
        }
    }
</script>
</body>
</html>
